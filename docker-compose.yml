services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # CPU-only embeddings preserve the existing Nomic/Chroma vector space.
  # Chat generation is served by llama.cpp.
  ollama:
    image: ollama/ollama:0.11.10
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11435:11434"
    restart: unless-stopped

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:b2aae63c399341c37187872d6c60b727b8f1e48b7dc15916f7aea956ac329229
    gpus: all
    volumes:
      - llama_models:/models:ro
    ports:
      - "127.0.0.1:8080:8080"
    command:
      - --model
      - /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
      - --alias
      - persona-qwen
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --parallel
      - "1"
      - --n-gpu-layers
      - "${LLAMA_GPU_LAYERS:-99}"
      - --threads
      - "4"
      - --batch-size
      - "256"
      - --ubatch-size
      - "128"
      - --n-predict
      - "512"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: "no"

  kokoro:
    profiles: [app]
    build: ./gcp-tts-service
    environment:
      KOKORO_CPU_THREADS: "4"
      ONNX_PROVIDER: CPUExecutionProvider
    cpus: 4
    mem_limit: 2g
    ports:
      - "127.0.0.1:8880:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  chatterbox:
    profiles: [app]
    build: ./chatterbox-service
    environment:
      CHATTERBOX_CPU_THREADS: "4"
    volumes:
      - chatterbox_models:/models
      - voice_samples:/voices:ro
    cpus: 4
    mem_limit: 4g
    ports:
      - "127.0.0.1:8881:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      start_period: 15m
      retries: 5
    restart: unless-stopped

  backend:
    profiles: [app]
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Override host để trỏ sang ollama service thay vì localhost
      OLLAMA_HOST: http://ollama:11434
      LLM_PROVIDER: llama_cpp
      TTS_PROVIDER: chatterbox-nano
      CHATTERBOX_TTS_URL: http://chatterbox:8080/synthesize
      KOKORO_TTS_URL: http://kokoro:8080/synthesize
      LOCAL_LLM_BASE_URL: http://llama-cpp:8080/v1
      LOCAL_LLM_LARGE_MODEL: persona-qwen
      LOCAL_LLM_SMALL_MODEL: persona-qwen
      LORE_DATA_PATH: /app/lore_data
      HOST: 0.0.0.0
      PORT: "8000"
      RELOAD: "false"
      DATABASE_URL: postgresql+asyncpg://chatbot:chatbot@postgres:5432/chatbot
    volumes:
      - chroma_data:/app/chroma_data
      - session_history:/app/data/session_history
      - stt_cache:/root/.cache/huggingface
      - voice_samples:/app/voices
      - ./characters:/characters:ro
      - ./backend/lore_data:/app/lore_data:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      llama-cpp:
        condition: service_healthy
      kokoro:
        condition: service_healthy
      chatterbox:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped

  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  chroma_data:
  postgres_data:
  session_history:
  llama_models:
    name: persona-graph-ai_llama_models
    external: true
  stt_cache:
  voice_samples:
  chatterbox_models:
